[project]
name = "fama-worker"
version = "0.1.0"
description = "Fama worker: turns links, files and text into narrated audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "fast-langdetect>=1.0",
    "httpx>=0.27",
    "kokoro>=0.9.4,<0.10",
    "lxml>=5",
    "misaki[en]>=0.9.4",
    "mlx-audio>=0.6.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "num2words>=0.5.14",
    "numpy>=1.26",
    "piper-tts>=1.3",
    "pymupdf>=1.25",
    "soundfile>=0.13",
    "torch>=2.6",
    "trafilatura>=2.0",
]

[project.scripts]
fama = "fama_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
