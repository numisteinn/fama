[project]
name = "fama-worker"
version = "0.1.0"
description = "Fama worker: turns links, files and text into narrated audio."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "en-core-web-sm",
    "fast-langdetect>=1.0",
    "httpx>=0.27",
    "kokoro>=0.9.4,<0.10",
    "lxml>=5",
    "misaki[en]>=0.9.4",
    "num2words>=0.5.14",
    "numpy>=1.26",
    "piper-tts>=1.3",
    "pypdfium2>=5",
    "soundfile>=0.13",
    "torch>=2.6",
    "trafilatura>=2.0",
]

[project.scripts]
fama = "fama_worker.cli:main"

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]
# `uv run --group bakeoff python bakeoff/run.py`: candidate models and ASR scoring, Apple Silicon only.
bakeoff = [
    "mlx-audio>=0.6.6; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
modal = [
    "modal>=1.6.4",
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
